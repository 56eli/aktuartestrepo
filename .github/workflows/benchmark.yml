name: Synthetic benchmark
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: |
          python scripts/run_benchmark.py --report "$RUNNER_TEMP/benchmark.html"
          diff -u docs/benchmark-probelauf.html "$RUNNER_TEMP/benchmark.html"
